[project]
name = "oil-sif-ai"
version = "2.1.0"
description = "OIL SIF Precursor AI & NLP Decision Support Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.2.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.5.0",
    "dnspython>=2.3.0",
    "certifi>=2023.7.22"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
